<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>華語大富翁</title>
<meta property="og:title" content="華語大富翁 · Monopoly de chino">
<meta property="og:description" content="課堂互動遊戲：擲骰子、走格子、說出圖片的中文 · Juego de clase">
<meta property="og:type" content="website">
<style>
:root{
  --felt:#14533a; --board:#cde6d0; --cream:#f6f3e8; --ink:#111; --red:#e1262c; --green:#1fa45a; --blue:#1b6fd8;
  --font:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--felt);color:var(--ink);font-family:var(--font)}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer}
.banner{display:inline-block;background:var(--red);color:#fff;font-weight:900;letter-spacing:.08em;border:4px solid var(--ink);
  padding:.18em .7em;transform:rotate(-3deg);text-shadow:2px 2px 0 var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);font-size:clamp(20px,3vw,40px);white-space:nowrap}

/* ===== 設定畫面 ===== */
.setup{max-width:760px;margin:0 auto;padding:22px 14px 30px;text-align:center}
.setup .sub{color:#d9eadd;margin:14px 0 18px;font-size:15px}
.setup .card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:12px 14px;margin:0 0 12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.setup h3{margin:0 0 8px;font-size:16px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.prow{display:flex;align-items:center;gap:8px;margin:6px 0}
.prow input{flex:1;font-size:17px;padding:7px 9px;border:2px solid var(--ink);border-radius:5px;background:#fff;min-width:0}
.prow svg{width:24px;height:32px;flex:none}
.x{border:2px solid var(--ink);background:#fff;border-radius:5px;width:34px;height:34px;font-size:15px}
.ghost{border:2px dashed var(--ink);background:transparent;border-radius:6px;padding:7px 12px;font-size:15px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:2px solid var(--ink);background:#fff;border-radius:6px;padding:6px 12px;font-size:16px;font-weight:700}
.chip.on{background:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:7px 0;font-size:15px}
.row label{display:flex;align-items:center;gap:6px}
.num{width:84px;font-size:16px;padding:6px 8px;border:2px solid var(--ink);border-radius:5px;background:#fff}
.f{font-size:.66em;font-weight:600;opacity:.88;margin-left:.35em;text-shadow:none;letter-spacing:0}
.btn .f,.bigbtn .f,.chip .f,.bill .f,.banner .f,.tile .gt .f,.turnName .f,.sub .f,h3 .f,.winner .f,.say .f,.hint .f,.rtitle .f,.modal th .f,.ghost .f,.gobig .f,.dband .f{display:block;margin-left:0}
.banner .f{font-size:.4em;letter-spacing:.04em;font-weight:700;text-shadow:none;margin-top:2px}
.btn,.bigbtn,.chip{line-height:1.2}
.bigbtn{border:4px solid var(--ink);border-radius:10px;background:var(--red);color:#fff;font-weight:900;font-size:22px;padding:12px 28px;box-shadow:0 6px 0 var(--ink);text-shadow:1px 1px 0 var(--ink)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.bigbtn:disabled{opacity:.45;box-shadow:0 3px 0 var(--ink);transform:translateY(3px);cursor:default}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.sq{border:3px solid var(--ink);background:var(--cream);border-radius:8px;font-size:20px;width:44px;height:44px;box-shadow:0 3px 0 var(--ink)}

/* ===== 遊戲畫面 ===== */
.game{display:flex;gap:14px;padding:10px;align-items:flex-start;justify-content:center}
.boardWrap{flex:1 1 0;min-width:0;display:flex;justify-content:center}
.board{display:grid;background:var(--board);border:4px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.4);width:100%}
.tile{position:relative;background:var(--cream);border:1.5px solid var(--ink);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tile .band{flex:none;height:22%;min-height:14px;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(9px,1.1vw,15px)}
.tile .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:3%}
.tile .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tile .fb{font-weight:800;font-size:clamp(10px,1.2vw,16px);text-align:center;line-height:1.2;color:#555}
.tile .pawns{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:0;pointer-events:none}
.tile .pawns svg{width:clamp(12px,1.9vw,26px);height:auto;margin:0 -2px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.tile.go{background:#fff;align-items:center;justify-content:center;text-align:center;font-weight:900;color:var(--red)}
.tile.go .gt{font-size:clamp(12px,1.9vw,26px);line-height:1.1}
.tile.go .ga{font-size:clamp(16px,2.6vw,36px);line-height:1}
.tile.cur{outline:4px solid #ffd400;outline-offset:-4px;z-index:2;box-shadow:0 0 0 3px var(--ink)}
.tile.hop{animation:hop .25s}
@keyframes hop{50%{transform:translateY(-6px) scale(1.04)}}
.center{grid-row:2 / var(--rEnd);grid-column:2 / var(--cEnd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0;padding:6px}
.center .banner{font-size:clamp(16px,3.2vw,46px)}
.center .info{font-weight:700;font-size:clamp(11px,1.3vw,18px);color:#2c5a3a;text-align:center}
.panel{flex:none;width:390px;max-height:calc(100vh - 20px);overflow:auto;background:var(--cream);border:4px solid var(--ink);border-radius:8px;padding:10px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.turn{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.turn svg{width:26px;height:34px;flex:none}
.turnName{font-size:21px;font-weight:900;line-height:1.15;word-break:break-word}
.diceRow{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.dice{width:78px;height:78px;flex:none;background:#fff;border:4px solid var(--ink);border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.dice i{display:block;border-radius:50%;margin:auto;width:78%;height:78%}
.dice i.on{background:var(--ink)}
.dice.roll{animation:shake .16s infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hint{font-size:14px;font-weight:700;color:#555}
.deed{border:3px solid var(--ink);background:#fff;margin:4px 0 10px}
.deed .dband{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;border-bottom:3px solid var(--ink);font-weight:900;font-size:15px}
.deed .dpic{height:min(26vh,220px);min-height:120px;display:flex;align-items:center;justify-content:center;padding:6px}
.deed.compact .dpic{height:min(15vh,130px);min-height:90px}
.deed .dpic img{max-width:100%;max-height:100%;object-fit:contain}
.deed .dpic .fb{font-size:30px;font-weight:900;color:#444;text-align:center}
.deed .say{text-align:center;font-weight:800;padding:6px 8px 9px;font-size:16px}
.deed .ans{text-align:center;padding:4px 8px 10px;border-top:2px dashed var(--ink)}
.deed .hz{font-size:44px;font-weight:900;line-height:1.15}
.deed .ph{font-size:20px;color:#333;margin-top:2px}
.deed .gobig{text-align:center;padding:18px 8px;font-weight:900;color:var(--red);font-size:26px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.btn{flex:1 1 auto;border:3px solid var(--ink);border-radius:8px;background:#fff;font-weight:800;font-size:17px;padding:10px 10px;box-shadow:0 4px 0 var(--ink);min-width:0}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.ok{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.no{background:var(--red);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.sm{font-size:14px;padding:7px 8px;box-shadow:0 3px 0 var(--ink)}
.rtitle{font-weight:900;font-size:17px;margin:6px 0}
.bill{flex:1 1 auto;border:3px solid var(--ink);border-radius:6px;font-weight:900;font-size:22px;padding:12px 10px;box-shadow:0 4px 0 var(--ink);background:linear-gradient(135deg,var(--b1),var(--b2))}
.bill:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.b1{--b1:#fff6a8;--b2:#f3e46b}.b2{--b1:#bfe8b0;--b2:#8fd17a}.b3{--b1:#b5d6f5;--b2:#7fb3e6}.b4{--b1:#f1e3c4;--b2:#dcc698}.b5{--b1:#ffd0a0;--b2:#f7a24f}
.custom{display:flex;gap:8px;margin:8px 0}
.custom input{flex:1;font-size:18px;padding:8px;border:3px solid var(--ink);border-radius:6px;min-width:0}
.score{margin-top:10px;border-top:3px solid var(--ink);padding-top:8px}
.srow{display:flex;align-items:center;gap:8px;padding:5px 6px;border:2px solid transparent;border-radius:6px;font-weight:800}
.srow.me{border-color:var(--ink);background:#fff3b0}
.srow svg{width:16px;height:22px;flex:none}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cn{font-variant-numeric:tabular-nums}
.srow .lp{font-size:13px;color:#555;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--cream);border:4px solid var(--ink);border-radius:10px;padding:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.modal h3{margin:0 0 10px;font-size:20px}
.modal table{width:100%;border-collapse:collapse}
.modal th{font-size:13px;text-align:left;padding:2px 4px}
.modal td{padding:3px 4px}
.modal td input{width:100%;font-size:16px;padding:6px;border:2px solid var(--ink);border-radius:5px;min-width:0}
.rank{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;padding:6px 4px;border-bottom:2px dashed #999}
.rank svg{width:22px;height:30px}
.winner{font-size:26px;font-weight:900;text-align:center;margin:4px 0 10px;color:var(--red)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;font-size:18px;z-index:1200;max-width:92vw;text-align:center}
@media (max-width:960px){
  .game{flex-direction:column;align-items:stretch}
  .panel{width:100%;max-height:none}
  .boardWrap{flex:none;width:100%}
}
</style>
</head>

<script>
/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设定安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支援语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */

</script>

const UI = {};
UI_TEXT.split('\n').forEach(l => { const [k,t,s,es,en] = l.split('|'); UI[k] = { t, s: s === '=' ? t : s, es, en }; });
function fill(s, v){ if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; }
function zhOf(u){ return Settings.script === 'simp' ? u.s : u.t; }
/* 畫面文字：選「中文＋外語」時，中文後面接小字外語；選「純中文」只有中文 */
function tx(k, v){
  const u = UI[k]; if (!u) return k;
  const z = fill(zhOf(u), v);
  if (Settings.lang === 'zh') return z;
  let f = fill(Settings.lang === 'es' ? u.es : u.en, v);
  const m = z.match(/^[^\p{L}\p{N}$]+/u);                 // 前面的表情符號（👁、✅…）只留中文那行
  if (m && f.startsWith(m[0])) f = f.slice(m[0].length);
  return f === z ? z : `${z}<span class="f">${f}</span>`;
}
/* 只要單一語言的純文字（預設名字：純中文→玩家 1、西文→Jugador 1、英文→Player 1） */
function txp(k, v){
  const u = UI[k]; if (!u) return k;
  return fill(Settings.lang === 'es' ? u.es : Settings.lang === 'en' ? u.en : zhOf(u), v);
}
/* 純文字「中文 / 外語」（輸入框提示、提示小視窗用，不能放 HTML） */
function txt(k, v){
  const u = UI[k]; if (!u) return k;
  const z = fill(zhOf(u), v);
  if (Settings.lang === 'zh') return z;
  const f = fill(Settings.lang === 'es' ? u.es : u.en, v);
  return f === z ? z : `${z} / ${f}`;
}
const tz = (k, v) => { const u = UI[k]; return u ? fill(zhOf(u), v) : k; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hz = it => Settings.script === 'simp' ? it.zhs : it.zh;

const DEF = { players:['',''], n:24, endMode:'laps', laps:2, coinsTarget:300, goOn:true, goAmount:50, startMoney:100, presets:[10,20,50] };
let cfg = loadCfg();
function loadCfg(){
  let c = {};
  try{ c = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; }catch(e){}
  const o = Object.assign({}, DEF, c);
  if (!Array.isArray(o.players) || !o.players.length || o.players.length > 6) o.players = DEF.players.slice();
  if (!Array.isArray(o.presets) || o.presets.length !== 3) o.presets = DEF.presets.slice();
  return o;
}
function saveCfg(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(cfg)); }catch(e){} }

function pawn(color){
  return `<svg viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="8" r="6" fill="${color}" stroke="#111" stroke-width="1.6"/><path d="M12 13C5 20 3 28 2 30H22C21 28 19 20 12 13Z" fill="${color}" stroke="#111" stroke-width="1.6"/></svg>`;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ring(c, r){
  const a = [];
  for (let col = c - 1; col >= 0; col--) a.push([r - 1, col]);
  for (let row = r - 2; row >= 0; row--) a.push([row, 0]);
  for (let col = 1; col < c; col++) a.push([0, col]);
  for (let row = 1; row < r - 1; row++) a.push([row, c - 1]);
  return a;
}
function billClass(v){ return v <= 10 ? 'b1' : v <= 20 ? 'b2' : v <= 50 ? 'b3' : v <= 100 ? 'b4' : 'b5'; }
function toast(msg){
  const old = document.getElementById('toast'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'toast'; d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

/* ============ 語音（只用台灣中文聲音） ============ */
function isMandarin(v){ const l = String((v && v.lang) || '').toLowerCase().replace(/_/g,'-'); if (l.indexOf('yue') === 0 || l.indexOf('zh-hk') === 0) return false; return l === 'zh' || l.indexOf('zh-') === 0 || l.indexOf('cmn') === 0; }
function speak(text){
  try{
    const ss = window.speechSynthesis; if (!ss) return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const ok = (ss.getVoices() || []).filter(isMandarin);
    const v = ok.find(x => /zh[-_]tw/i.test(x.lang)) || ok[0];
    if (v) u.voice = v;
    u.lang = 'zh-TW'; u.rate = RATE_VALUE[Settings.rate] || 0.65;
    ss.speak(u);
  }catch(e){}
}

/* ============ 遊戲畫面 ============ */
function startGame(){
  let n = Math.round(+cfg.n || 24); n = Math.max(12, Math.min(40, n)); if (n % 2) n++;
  cfg.n = n; cfg.laps = Math.max(1, Math.round(+cfg.laps || 1)); cfg.coinsTarget = Math.max(1, +cfg.coinsTarget || 100);
  cfg.startMoney = Math.max(0, +cfg.startMoney || 0); cfg.goAmount = Math.max(0, +cfg.goAmount || 0);
  cfg.presets = cfg.presets.map((v, i) => Math.max(1, Math.round(+v || DEF.presets[i])));
  saveCfg();
  const pool = shuffle(POOL.slice());
  G.tiles = [null]; for (let i = 1; i < n; i++) G.tiles.push(pool[(i - 1) % pool.length]);
  G.n = n; const s = n / 2 + 2; G.r = Math.max(3, Math.round(s * 0.43)); G.c = s - G.r; G.cells = ring(G.c, G.r);
  G.players = cfg.players.map((nm, i) => ({ name: (nm || '').trim() || `${txp('playerDefault')} ${i + 1}`, color: COLORS[i], pos: 0, coins: cfg.startMoney, laps: 0 }));
  G.cur = 0; G.dice = null; G.phase = 'ready'; G.revealed = false; G.lapGained = false; G.screen = 'game';
  renderGame();
}
function renderGame(){
  G.screen = 'game';
  const ar = G.c / (G.r * 1.12);
  $app.innerHTML = `<div class="game"><div class="boardWrap"><div id="board" class="board" style="grid-template-columns:repeat(${G.c},1fr);grid-template-rows:repeat(${G.r},1fr);aspect-ratio:${ar};max-width:calc((100vh - 60px) * ${ar});--rEnd:${G.r};--cEnd:${G.c}"></div></div><aside id="panel" class="panel"></aside></div>`;
  buildBoard(); renderPanel(); updatePawns();
}
function buildBoard(){
  const b = document.getElementById('board'); let h = '';
  for (let i = 0; i < G.n; i++){
    const [row, col] = G.cells[i]; const pos = `grid-row:${row + 1};grid-column:${col + 1}`;
    if (i === 0){
      h += `<div class="tile go" data-i="0" style="${pos}"><div class="gt">${tx('goName')}</div><div class="ga">⬅</div><div class="pawns"></div></div>`;
    } else {
      const it = G.tiles[i], bi = (i - 1) % 8;
      h += `<div class="tile" data-i="${i}" style="${pos}"><div class="band" style="background:${BANDS[bi]};color:${BAND_TXT[bi]}">${i}</div><div class="pic">${picHTML(it)}</div><div class="pawns"></div></div>`;
    }
  }
  h += `<div class="center"><div class="banner">${tx('title')}</div><div class="info">${modeInfo()}</div></div>`;
  b.innerHTML = h;
  b.querySelectorAll('img').forEach(img => img.addEventListener('error', () => imgFail(img)));
}
function picHTML(it){ return `<img src="images/圖片${it.id}.webp" alt="" data-fb="${esc(it.es || it.en || '？')}">`; }
function imgFail(img){ const d = document.createElement('div'); d.className = 'fb'; d.textContent = img.dataset.fb || '？'; img.replaceWith(d); }
function modeInfo(){
  if (cfg.endMode === 'laps') return `${cfg.laps} ${tz('lapsN')}`;
  if (cfg.endMode === 'coins') return `$ ${cfg.coinsTarget}`;
  return tx('endManual');
}
function updatePawns(){
  const b = document.getElementById('board'); if (!b) return;
  b.querySelectorAll('.tile').forEach(t => {
    const i = +t.dataset.i;
    t.querySelector('.pawns').innerHTML = G.players.filter(p => p.pos === i).map(p => pawn(p.color)).join('');
    const showCur = ['moving','answer','reward','goLanded'].includes(G.phase) && curP() && curP().pos === i;
    t.classList.toggle('cur', !!showCur);
  });
}
function hopTile(i){ const t = document.querySelector(`.tile[data-i="${i}"]`); if (t){ t.classList.remove('hop'); void t.offsetWidth; t.classList.add('hop'); } }

function diceHTML(v){
  const on = PIPS[v] || [];
  return `<div class="dice${G.phase === 'rolling' ? ' roll' : ''}" id="dice">${[0,1,2,3,4,5,6,7,8].map(i => `<i class="${on.includes(i) ? 'on' : ''}"></i>`).join('')}</div>`;
}
function setDice(v){ const d = document.getElementById('dice'); if (d) d.innerHTML = [0,1,2,3,4,5,6,7,8].map(i => `<i class="${(PIPS[v] || []).includes(i) ? 'on' : ''}"></i>`).join(''); }

function renderPanel(){
  const el = document.getElementById('panel'); if (!el) return;
  const p = curP(), ph = G.phase; let h = '';
  h += `<div class="btns"><button class="btn sm" data-act="settings">⚙️ ${tx('settings')}</button><button class="btn sm" data-act="tools">${tx('teacher')}</button><button class="btn sm" data-act="endAsk">${tx('endGame')}</button></div>`;
  h += `<div class="turn">${pawn(p.color)}<div class="turnName">${tx('turn', { n: esc(p.name) })}</div></div>`;
  h += `<div class="diceRow">${diceHTML(G.dice)}<div style="flex:1">${
    ph === 'ready' ? `<button class="bigbtn" style="width:100%;font-size:20px;padding:10px 6px" data-act="roll">${tx('roll')}</button><button class="btn sm" style="width:100%;margin-top:8px" data-act="skip">${tx('skip')}</button>`
    : ph === 'rolling' ? `<div class="hint">${tx('rolling')}</div>`
    : ph === 'moving' ? `<div class="hint">${tx('moving')}</div>` : ''}</div></div>`;
  if (ph === 'answer' || ph === 'reward'){
    const it = G.tiles[p.pos], bi = (p.pos - 1) % 8;
    h += `<div class="deed${ph === 'reward' ? ' compact' : ''}"><div class="dband" style="background:${BANDS[bi]};color:${BAND_TXT[bi]}"><span>${tx('tileNo', { n: p.pos })}</span></div>
      <div class="dpic">${picHTML(it)}</div>
      ${G.revealed ? `<div class="ans"><div class="hz">${esc(hz(it))}</div>${phonHTML(it)}</div>` : `<div class="say">${tx('sayIt')}</div>`}</div>`;
    if (ph === 'answer'){
      h += `<div class="btns">${G.revealed ? '' : `<button class="btn" data-act="reveal">${tx('reveal')}</button>`}<button class="btn" data-act="speakIt">${tx('speak')}</button></div>
        <div class="btns"><button class="btn ok" data-act="correct">${tx('correct')}</button><button class="btn no" data-act="wrong">${tx('wrong')}</button></div>`;
    } else {
      h += `<div class="rtitle">${tx('rewardTitle')}</div>
        <div class="btns">${cfg.presets.map(v => `<button class="bill ${billClass(v)}" data-act="reward" data-v="${v}">+$${v}</button>`).join('')}</div>
        <div class="custom"><input id="customReward" type="number" min="0" placeholder="${txt('custom')}"><button class="btn" style="flex:none" data-act="rewardCustom">${tx('ok')}</button></div>
        <button class="btn sm" style="width:100%" data-act="reward" data-v="0">${tx('noReward')}</button>`;
    }
  } else if (ph === 'goLanded'){
    h += `<div class="deed"><div class="dband" style="background:#fff"><span>${tx('goName')}</span></div><div class="gobig">${tx('goLand')}${cfg.goOn ? `<div style="font-size:20px;margin-top:6px">+$${cfg.goAmount}</div>` : ''}</div></div>
      <div class="btns"><button class="btn ok" data-act="goNext">${tx('next')}</button></div>`;
  }
  h += `<div class="score">${G.players.map((q, i) => `<div class="srow${i === G.cur ? ' me' : ''}">${pawn(q.color)}<span class="nm">${esc(q.name)}</span><span class="lp">${tz('lapShort')} ${q.laps}${cfg.endMode === 'laps' ? '/' + cfg.laps : ''}</span><span class="cn">$${q.coins}</span></div>`).join('')}</div>`;
  el.innerHTML = h;
  el.querySelectorAll('img').forEach(img => img.addEventListener('error', () => imgFail(img)));
}
function phonHTML(it){
  const m = Settings.phon;
  if (m === 'off') return '';
  const lines = [];
  if (m === 'pinyin' || m === 'both') lines.push(esc(it.py));
  if (m === 'zhuyin' || m === 'both') lines.push(esc(it.zy));
  return lines.map(l => `<div class="ph">${l}</div>`).join('');
}

/* ============ 回合流程 ============ */
function roll(){
  if (G.phase !== 'ready') return;
  G.phase = 'rolling'; renderPanel(); updatePawns();
  let k = 0;
  const tm = setInterval(() => {
    k++; setDice(1 + Math.floor(Math.random() * 6));
    if (k >= 9){
      clearInterval(tm);
      const d = window.__nextDice ? +window.__nextDice : 1 + Math.floor(Math.random() * 6);
      window.__nextDice = 0; G.dice = d; G.phase = 'moving'; renderPanel(); move(d);
    }
  }, 80);
}
function move(d){
  const p = curP(); G.from = p.pos; G.lapGained = p.pos + d >= G.n; G.revealed = false;
  let step = 0;
  const t = setInterval(() => {
    step++; p.pos = (p.pos + 1) % G.n; updatePawns(); hopTile(p.pos);
    if (step >= d){ clearInterval(t); G.phase = p.pos === 0 ? 'goLanded' : 'answer'; renderPanel(); updatePawns(); }
  }, 230);
}
function award(v){
  const p = curP(); let gain = v;
  if (G.lapGained){
    p.laps++;
    if (cfg.goOn && cfg.goAmount > 0){ gain += cfg.goAmount; toast(txt('goPass', { n: '$' + cfg.goAmount })); }
  }
  p.coins += gain; G.lapGained = false;
  afterTurn();
}
function wrongMove(){
  const p = curP(); G.phase = 'moving'; G.lapGained = false; renderPanel();
  const t = setInterval(() => {
    p.pos = (p.pos - 1 + G.n) % G.n; updatePawns();
    if (p.pos === G.from){ clearInterval(t); toast(txt('backWrong')); afterTurn(); }
  }, 140);
  if (p.pos === G.from){ clearInterval(t); afterTurn(); }
}
function isOver(){
  if (cfg.endMode === 'laps') return G.players.some(p => p.laps >= cfg.laps);
  if (cfg.endMode === 'coins') return G.players.some(p => p.coins >= cfg.coinsTarget);
  return false;
}
function afterTurn(){
  if (isOver()){ finish(); return; }
  nextPlayer();
}
function nextPlayer(){
  G.cur = (G.cur + 1) % G.players.length; G.phase = 'ready'; G.revealed = false; G.lapGained = false;
  renderPanel(); updatePawns();
}
function finish(){
  G.phase = 'over'; renderPanel(); updatePawns();
  const rk = G.players.slice().sort((a, b) => b.coins - a.coins || b.laps - a.laps);
  openModal(`<div class="winner">${tx('winner', { n: esc(rk[0].name) })}</div>
    <h3>${tx('ranking')}</h3>
    ${rk.map((p, i) => `<div class="rank"><span>${['🥇','🥈','🥉'][i] || (i + 1)}</span>${pawn(p.color)}<span style="flex:1">${esc(p.name)}</span><span>$${p.coins}</span></div>`).join('')}
    <div class="btns" style="margin-top:12px"><button class="btn ok" data-act="again">${tx('again')}</button><button class="btn" data-act="backSetup">${tx('backSetup')}</button></div>`);
}

/* ============ 彈出視窗 ============ */
function openModal(html){
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(o);
}
function closeModal(){ const o = document.getElementById('overlay'); if (o) o.remove(); }
function settingsHTML(){
  const seg = (k, opts) => `<div class="row"><b style="min-width:84px">${tx(k === 'script' ? 'setScript' : k === 'lang' ? 'setLang' : k === 'phon' ? 'setPhon' : 'setRate')}</b><div class="chips">${opts.map(([v, label]) => `<button class="chip${Settings[k] === v ? ' on' : ''}" data-act="setS" data-k="${k}" data-v="${v}">${label}</button>`).join('')}</div></div>`;
  return `<h3>⚙️ ${tx('settings')}</h3>
    ${seg('script', [['trad', tx('trad')], ['simp', tx('simp')]])}
    ${seg('lang', [['es', '中文＋Español'], ['en', '中文＋English'], ['zh', Settings.script === 'simp' ? '纯中文' : '純中文']])}
    ${seg('phon', [['pinyin', tx('pinyin')], ['zhuyin', tx('zhuyin')], ['both', tx('both')], ['off', tx('off')]])}
    ${seg('rate', [['slow', tx('slow')], ['normal', tx('normal')], ['fast', tx('fast')]])}
    <div class="btns"><button class="btn" data-act="closeModal">${tx('close')}</button></div>`;
}
function toolsHTML(){
  return `<h3>${tx('teacher')}</h3>
    <table><tr><th></th><th>${tx('cName')}</th><th>${tx('cCoins')}</th><th>${tx('cPos')}</th><th>${tx('cLaps')}</th></tr>
    ${G.players.map((p, i) => `<tr><td>${pawn(p.color).replace('<svg ', '<svg width="18" height="24" ')}</td>
      <td><input data-tp="${i}" data-f="name" value="${esc(p.name)}" maxlength="12"></td>
      <td><input type="number" data-tp="${i}" data-f="coins" value="${p.coins}"></td>
      <td><input type="number" data-tp="${i}" data-f="pos" min="0" max="${G.n - 1}" value="${p.pos}"></td>
      <td><input type="number" data-tp="${i}" data-f="laps" min="0" value="${p.laps}"></td></tr>`).join('')}</table>
    <div class="btns" style="margin-top:10px"><button class="btn" data-act="closeTools">${tx('close')}</button></div>`;
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'set': cfg[b.dataset.k] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; renderSetup(); break;
    case 'addp': if (cfg.players.length < 6){ cfg.players.push(''); renderSetup(); } break;
    case 'delp': if (cfg.players.length > 1){ cfg.players.splice(+b.dataset.i, 1); renderSetup(); } break;
    case 'start': if (cfg.players.length >= 1) startGame(); break;
    case 'settings': openModal(settingsHTML()); break;
    case 'setS': Settings[b.dataset.k] = b.dataset.v; writeSettings(Settings); openModal(settingsHTML());
      if (G.screen === 'game') renderGame(); else renderSetup(); break;
    case 'closeModal': closeModal(); break;
    case 'roll': roll(); break;
    case 'skip': if (G.phase === 'ready') nextPlayer(); break;
    case 'reveal': G.revealed = true; renderPanel(); speak(G.tiles[curP().pos].zh); break;
    case 'speakIt': speak(G.tiles[curP().pos].zh); break;
    case 'correct': if (G.phase === 'answer'){ G.phase = 'reward'; renderPanel(); } break;
    case 'wrong': if (G.phase === 'answer') wrongMove(); break;
    case 'reward': if (G.phase === 'reward') award(+b.dataset.v || 0); break;
    case 'rewardCustom': if (G.phase === 'reward'){ const v = Math.max(0, Math.round(+document.getElementById('customReward').value || 0)); award(v); } break;
    case 'goNext': if (G.phase === 'goLanded') award(0); break;
    case 'tools': openModal(toolsHTML()); break;
    case 'closeTools': closeModal(); renderPanel(); updatePawns(); break;
    case 'endAsk': openModal(`<h3>${tx('confirmEnd')}</h3><div class="btns"><button class="btn no" data-act="endYes">${tx('yes')}</button><button class="btn" data-act="closeModal">${tx('cancel')}</button></div>`); break;
    case 'endYes': closeModal(); finish(); break;
    case 'again': closeModal(); startGame(); break;
    case 'backSetup': closeModal(); renderSetup(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pn !== undefined){ cfg.players[+t.dataset.pn] = t.value; saveCfg(); }
  else if (t.dataset.cfg){ cfg[t.dataset.cfg] = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? t.value : t.value); saveCfg(); }
  else if (t.dataset.preset !== undefined){ cfg.presets[+t.dataset.preset] = t.value; saveCfg(); }
  else if (t.dataset.tp !== undefined){
    const p = G.players[+t.dataset.tp], f = t.dataset.f;
    if (f === 'name') p.name = t.value.slice(0, 12) || p.name;
    else if (f === 'pos') p.pos = Math.max(0, Math.min(G.n - 1, Math.round(+t.value || 0)));
    else if (f === 'laps') p.laps = Math.max(0, Math.round(+t.value || 0));
    else p.coins = Math.round(+t.value || 0);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.cfg === 'goOn'){ cfg.goOn = t.checked; saveCfg(); renderSetup(); }
  if (t.dataset.cfg === 'n'){ document.querySelectorAll('.chip[data-k=n]').forEach(c => c.classList.toggle('on', String(cfg.n) === c.dataset.v)); }
});

window.__mono = { G, get cfg(){ return cfg; }, POOL };
renderSetup();
})();
</script>
